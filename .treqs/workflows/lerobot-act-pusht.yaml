name: lerobot-act-pusht reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.
#
# Row-specific additions on top of the generated file, both in the setup stage:
#   (a) LeRobot is a FRAMEWORK, not a single script, so its dependency set has to
#       be installed before anything can run. scaffold_row.py has no install step
#       (single-file rows need none), so the install is added here.
#   (b) the egg-info sweep is repeated AFTER that install. The generated sweep runs
#       before it, which is too early for a row that installs in the same stage --
#       see the comment on the sweep below.

secrets:
  - HF_TOKEN            # roar put upload (the dataset itself is fetched anonymously)
# NOTE: the provenance CLI is no longer fetched from a presigned URL held in a
# per-target secret. It is a PUBLISHED build, installed by name+version from a
# public index and verified by wheel sha256 (repro/verify_roar_wheel.py). That
# removes a shared mutable secret from the run: two operators sharing this
# compute target can no longer overwrite each other's tooling.

# WHY THE TRACED STEPS ARE `python repro/<script>.py` AND NOT `lerobot-train`:
# every recorded step must be self-sufficient on a bare clone.
#  * `lerobot-train` is a console script created by `pip install`. The install
#    runs in this file's untraced setup stage, so it is not part of the recorded
#    pipeline and is not replayed on a rebuild host, where the script would not
#    exist. A recorded `lerobot==0.6.2` pin would not rescue it either -- that
#    version is not published on PyPI (latest release: 0.6.1).
#  * `PYTHONPATH=src python -m ...` would depend on an environment variable set
#    outside the recorded command, and needs a shell, which costs the tracer its
#    view of the Python process.
# repro/train_act.py therefore does the `sys.path` insert itself, in committed
# code, and calls upstream's own `lerobot.scripts.lerobot_train.main()` with
# upstream's own arguments. repro/evaluate_act.py does the same. Nothing under
# src/ is modified. lerobot/__version__.py already degrades to "unknown" when the
# distribution is absent, so importing from source is a supported upstream path.

# EXPERIMENT LOGGING IS NOW ON -- BY CONFIGURATION ONLY. Nothing under src/ is
# modified; the three flags below are upstream's own, already implemented:
#   --wandb.enable=true          WandBConfig.enable defaults False
#                                (src/lerobot/configs/default.py:94); the call site
#                                gates on `cfg.wandb.enable and cfg.wandb.project`
#                                (src/lerobot/scripts/lerobot_train.py:393).
#   --wandb.project=...          required by that same gate.
#   --wandb.disable_artifact=true  NOT optional. With logging on, LeRobot's
#                                WandBLogger.log_policy() calls wandb.log_artifact()
#                                at every checkpoint save. The tracker implements
#                                log_artifact for real, so without this flag the run
#                                would upload the ~207 MB model.safetensors to the
#                                Space on every save. log_policy() returns early when
#                                disable_artifact is set (wandb_utils.py:126).
#
# WHY `env TRACKIO_SPACE_ID=... ` IS INSIDE THE RECORDED COMMAND, NOT AN `export`
# ABOVE IT. This is the single most important line in this file and it is easy to
# get wrong in a way that passes capture and fails every rebuild.
#
# `roar run` records ARGV ONLY. Environment set on a preceding line of this stage is
# NOT part of the lineage and is NOT replayed by `roar reproduce`. The wandb->trackio
# bridge chooses its mode from the environment of the traced child:
#   * TRACKIO_SPACE_ID set  -> alias wandb to trackio  (this Run HAS get_url())
#   * TRACKIO_SPACE_ID unset -> alias wandb to a silent no-op stub
# and the no-op stub's _Run class implements only summary/config/id/name/log/finish/
# watch/log_code -- it has NO get_url. LeRobot calls wandb.run.get_url() unguarded at
# src/lerobot/common/wandb_utils.py:122, during WandBLogger.__init__, before training
# step 1. So with the space id merely `export`ed around the command, this step would
# succeed at capture and die on every rebuild host with
#   AttributeError: '_Run' object has no attribute 'get_url'
# Verified directly against the installed 0.4.4rc5 bridge, both branches.
#
# Putting the assignment inside the argv makes the requirement travel with the
# record: `roar reproduce` replays the command verbatim, so a rebuild host takes the
# trackio-alias branch too and get_url() resolves. `env` is exec, not a shell, so the
# tracer keeps its view of the Python process -- measured identically (in:0 out:1) for
# `env VAR=v python probe.py` and for bare `python probe.py`. And reproduce does not
# rewrite argv[0]; it only prepends the rebuilt venv's bin to PATH, so the `python`
# that `env` resolves is still the recorded interpreter.
#
# A rebuild host has no HF_TOKEN, so its trackio falls back to local logging and
# uploads nothing -- warnings, exit 0, no credential required. That is the intended
# third-party path, and it is why trackio must be a RECORDED PIN: if `import trackio`
# fails on the rebuild host the bridge silently drops to the no-op stub and the
# get_url crash returns.

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -c "import sys; print('python', sys.version)"
    python -m pip install --quiet requests || true
    rm -rf *.egg-info src/*.egg-info
    sudo rm -rf /usr/local/lib/python3.10/dist-packages/roar_cli-*.dist-info \
                /usr/local/lib/python3.10/dist-packages/roar \
                /opt/pytorch/lib/python3.12/site-packages/roar_cli-*.dist-info \
                /opt/pytorch/lib/python3.12/site-packages/roar \
                /usr/local/bin/roar /usr/local/bin/roar-worker \
                /opt/pytorch/bin/roar /opt/pytorch/bin/roar-worker \
                /usr/local/lib/python3.10/dist-packages/roar_inject.pth \
                /opt/pytorch/lib/python3.12/site-packages/roar_inject.pth
    # `uv` is not on PATH on every campaign AMI (this stage runs as root, and
    # /root/.local/bin is not always inherited), and the generated block calls it
    # unqualified -- so make it explicit and bootstrap it if the image lacks it.
    # This stage is `trace: off`, so nothing here reaches the lineage.
    export PATH=$PATH:/root/.local/bin:/usr/local/bin
    command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh; }
    command -v uv
    # The provenance CLI must run under the SAME interpreter the workload records.
    # Installing it under the host's system python lets that interpreter's
    # dist-packages shadow the recorded pins inside the traced child, which can
    # make a run pass against host packages instead of the recorded ones. So the
    # interpreter is read off the workload's own python rather than hard-coded.
    RECORDED_PY="$(python -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')"
    echo "recorded interpreter: $RECORDED_PY"
    # `--index-strategy unsafe-best-match` is REQUIRED, not optional: uv gives an
    # --extra-index-url priority over the --index-url, so with the default
    # first-match strategy it finds roar-cli on the main index, never sees this
    # version, and dies with "no version of roar-cli==0.4.4rc5". Verified locally
    # before this run. The build is then pinned by sha256 immediately below, which
    # is what actually establishes identity.
    # `--with huggingface-hub`: belt and braces. This build finally declares
    # huggingface-hub as a real runtime dependency, but the publish stage
    # (`roar put ... hf://`) is the step that dies -- after every traced step has
    # succeeded -- if it is ever absent, so the flag stays. It goes in the CLI's
    # own isolated venv, not the workload's, so it does not touch the recorded
    # environment.
    uv tool install --python "$RECORDED_PY" --force --with huggingface-hub \
        --index-strategy unsafe-best-match \
        --index-url https://test.pypi.org/simple/ \
        --extra-index-url https://pypi.org/simple/ \
        roar-cli==0.4.4rc5
    # ...and ask uv where it put the entrypoints rather than assuming /root.
    sudo ln -sf "$(uv tool dir --bin 2>/dev/null || echo /root/.local/bin)/roar" /usr/local/bin/roar
    test "$(roar --version | grep -o '[0-9][^ ]*$')" = "0.4.4rc5" || \
      { echo "WRONG ROAR: $(roar --version)"; exit 1; }
    # A version string is not an identity -- distinct builds have shipped under one
    # version string on this project before. Pin the artefact by wheel sha256 and
    # prove the installed files came from that wheel.
    ROAR_WHEEL_SCRATCH=/var/tmp python repro/verify_roar_wheel.py \
      --version 0.4.4rc5 \
      --sha256 ed35ed6bda3b5698ab65a887e7390c2ac073123f6d94bfa27b8282285352219c \
      --exe "$(command -v roar)"
    test "$(ls /usr/local/bin/../lib/python3.10/dist-packages/roar/bin 2>/dev/null | wc -l)" != "0" || \
      test "$(ls $(dirname $(readlink -f $(command -v roar)))/../lib/python*/site-packages/roar/bin | wc -l)" -ge 6 || \
      { echo "NO TRACER BINARIES"; exit 1; }
    roar --version
    roar tracer use preload
    roar tracer
    # --- LeRobot's own dependency set -------------------------------------
    # Install upstream's declared `training` extra (dataset + accelerate +
    # wandb) -- exactly what src/lerobot/scripts/lerobot_train.py needs.
    python -m pip install --constraint repro/constraints.txt -e ".[training]"
    # `trackio` is the tracker the wandb->trackio bridge aliases `wandb` onto. It
    # must be importable BY THE WORKLOAD'S OWN INTERPRETER: the bridge does a plain
    # `import trackio` inside the traced child and falls back to a no-op stub (no
    # get_url -> LeRobot crashes) if that import fails. It is a normal public PyPI
    # package, it is genuinely loaded by this run, and it therefore belongs in the
    # recorded environment rather than being smuggled in from the CLI's own venv.
    python -m pip install --constraint repro/constraints.txt trackio
    # ...then drop the self-install, keeping every dependency. roar's provenance
    # filter classifies any path under an EDITABLE install's source dir as a
    # "package read" and drops it, and `pip install -e .` registers the WHOLE
    # REPOSITORY as that source dir (direct_url.json, url=file://<repo>). Left in
    # place it makes every read of data/ and outputs/ disappear, and the lineage
    # lands as disconnected nodes with no provenance edges.
    python -m pip uninstall -y lerobot
    # THE UNINSTALL IS NOT ENOUGH ON ITS OWN. setuptools' src-layout editable
    # install writes `src/lerobot.egg-info/`, and pip does NOT remove it on
    # uninstall. Our traced steps put `src/` on sys.path (repro/train_act.py), so
    # `importlib.metadata` re-discovers that egg-info and reports lerobot 0.6.2 as
    # an INSTALLED distribution inside the traced process -- which is what a
    # name-based freeze records. `lerobot==0.6.2` is not on PyPI (latest release
    # 0.6.1), so that pin alone would make the recorded environment
    # un-installable. Measured directly: with src/ on sys.path,
    # importlib.metadata.version("lerobot") -> "0.6.2" after the uninstall; after
    # this sweep it raises PackageNotFoundError. The generated sweep at the top of
    # this stage runs BEFORE the install, so it cannot catch this.
    rm -rf ./*.egg-info src/*.egg-info
    python -m pip list 2>/dev/null | grep -Ei '^(torch|torchvision|torchcodec|numpy|datasets|pyarrow|accelerate|draccus|huggingface-hub|safetensors|einops|gymnasium|opencv-python-headless|wandb) ' || true
    # Gate the environment BEFORE any paid step: a `+cuNNN` local version or a
    # PEP-503 duplicate makes the recorded freeze un-installable from PyPI, so
    # the lineage could never be rebuilt. Fail here rather than at verification.
    python repro/freeze_audit.py
    python -c "import torch, torchvision; print('torch', torch.__version__, '| torchvision', torchvision.__version__, '| cuda', torch.cuda.is_available(), '|', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'cpu')"
    # lerobot must NOT be discoverable as an installed distribution, WITH src on
    # sys.path -- that is the proof there is no self-install and no leftover
    # egg-info left to pollute the record or blind the tracer.
    python -c "import os, sys; sys.path.insert(0, os.path.abspath('src')); import importlib.metadata as m; d=[x.metadata['Name'] for x in m.distributions() if (x.metadata['Name'] or '').lower()=='lerobot']; print('lerobot distributions visible to importlib.metadata:', d); sys.exit(1 if d else 0)"
    # ...and it must resolve from src/, which is what the traced steps and a
    # rebuild host both do.
    python -c "import os, sys; sys.path.insert(0, os.path.abspath('src')); import importlib.util; s=importlib.util.find_spec('lerobot.scripts.lerobot_train'); print('train entry module:', s.origin); assert s.origin.startswith(os.path.join(os.getcwd(), 'src')), 'lerobot must resolve from the checkout'"
    python -c "import os, sys; sys.path.insert(0, os.path.abspath('src')); import lerobot; from lerobot.policies import make_policy; print('lerobot', lerobot.__version__, 'imported from source OK')"
    # Diagnostic only, never fatal: record which package roots this interpreter
    # exposes and what lives under the base image's system root, so the recorded
    # package list can afterwards be read against the environment it came from
    # instead of being taken on trust.
    python repro/substrate_probe.py || true
    # The bridge takes the trackio branch only if the WORKLOAD interpreter can
    # import trackio. Assert it here rather than discovering the silent no-op
    # fallback after training has already run.
    python -c "import trackio; print('trackio', trackio.__version__)"
    # The bridge uploads only when a token is present; without one it buffers
    # locally and the published dashboard is EMPTY while still returning HTTP 200.
    # So prove the token reached this task's environment before paying for a run.
    # Value never printed -- length only.
    python -c "import os,sys; t=os.environ.get('HF_TOKEN') or ''; print('HF_TOKEN present in task env:', bool(t), '| length:', len(t)); sys.exit(0 if t else 1)"
    # --- COST-MODEL MEASUREMENT, not part of the pipeline ------------------
    # ACT's default backbone is `resnet18` with
    # pretrained_backbone_weights="ResNet18_Weights.IMAGENET1K_V1"
    # (src/lerobot/policies/act/configuration_act.py:98-99), so the first policy
    # construction downloads torchvision's ImageNet checkpoint from
    # download.pytorch.org. That download is inside the train step's wall-clock on
    # any cold host, and previous full-run estimates for this row had to EXCLUDE it
    # as an unquantified caveat. Time it here into a THROWAWAY TORCH_HOME so the
    # real cache stays cold and the train step still pays the cost it would pay on
    # a fresh machine -- this only measures the size of that component, it does not
    # remove it. Never fatal.
    rm -rf /var/tmp/torchhome-probe
    TORCH_HOME=/var/tmp/torchhome-probe python -c "
import time, torchvision, os
t0 = time.time()
torchvision.models.resnet18(weights='ResNet18_Weights.IMAGENET1K_V1')
dt = time.time() - t0
tot = sum(os.path.getsize(os.path.join(d,f)) for d,_,fs in os.walk('/var/tmp/torchhome-probe') for f in fs)
print('RESNET18_IMAGENET_WEIGHTS_DOWNLOAD_SECONDS %.2f BYTES %d' % (dt, tot))
" || true
    rm -rf /var/tmp/torchhome-probe
    git status --porcelain
    roar init || true
  trace: off

fetch_dataset:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n fetch_dataset -- python repro/fetch_dataset.py --repo-id lerobot/pusht_image --out-dir data/pusht_image
  trace: off

train:
  command: |
    # `--num_workers=0` is not a performance choice, it is a provenance one: with
    # DataLoader workers (spawn) a traced step can record only roar's own package
    # closure instead of the workload's, which would drop accelerate/termcolor and
    # everything else lerobot_train.py needs from the record. Single-process
    # loading costs seconds on a 31 MB dataset and makes the record complete.
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n train --wandb-to-trackio -- env TRACKIO_SPACE_ID=reproducible-ai/experiments python repro/train_act.py --dataset.repo_id=lerobot/pusht_image --dataset.root=data/pusht_image --dataset.eval_split=0.1 --policy.type=act --policy.device=cuda --policy.push_to_hub=false --steps=300 --batch_size=8 --num_workers=0 --log_freq=25 --eval_steps=150 --env_eval_freq=0 --save_freq=-1 --seed=1000 --output_dir=outputs/act_pusht --job_name=act_pusht_truncated --wandb.enable=true --wandb.project=lerobot-act-pusht --wandb.disable_artifact=true
  trace: off

evaluate:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n evaluate -- python repro/evaluate_act.py --checkpoint outputs/act_pusht/checkpoints/000300/pretrained_model --repo-id lerobot/pusht_image --root data/pusht_image --eval-split 0.1 --batch-size 8 --device cuda --out metrics/metrics.json
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact outputs/act_pusht/checkpoints/000300/pretrained_model/model.safetensors model.name=lerobot-act-pusht model.version=1 license.id=Apache-2.0 license.name='Apache License 2.0' description='LeRobot ACT (Action Chunking Transformer, ResNet-18 backbone) trained on the public lerobot/pusht_image LeRobotDataset. TRUNCATED pipeline-viability run: 300 of the 100000 default training steps, NOT converged.' documentation.url=https://github.com/huggingface/lerobot/blob/main/docs/source/act.mdx
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar put outputs/act_pusht/checkpoints/000300/pretrained_model/model.safetensors hf://reproducible-ai/lerobot-act --public --yes --no-tag -m "ACT policy (Action Chunking Transformer, ResNet-18 backbone) trained on the public lerobot/pusht_image LeRobotDataset: 300 of the 100000 default training steps, batch size 8. TRUNCATED pipeline-viability run, NOT converged and not a quality result."
  trace: off
