name: lerobot-act-pusht reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.

secrets:
  - HF_TOKEN            # roar put upload (the dataset itself is fetched anonymously)

# EXPERIMENT LOGGING IS DELIBERATELY OFF, so `--wandb-to-trackio` is not passed on
# the run stages either. LeRobot does ship wandb support (--wandb.enable), but
# under the wandb->trackio alias it aborts in WandBLogger.__init__:
# src/lerobot/common/wandb_utils.py calls `wandb.run.get_url()`, which trackio's
# Run does not implement. Rather than patch upstream to accommodate the tracker,
# this row runs with logging off; the held-out metric is computed by the evaluate
# step and recorded as metrics/metrics.json instead.

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -c "import sys; print('python', sys.version)"
    python -m pip install --quiet requests || true
    # LeRobot is a framework, not a script. Install THIS checkout editable with
    # the `training` extra (dataset + accelerate + wandb) -- exactly what
    # src/lerobot/scripts/lerobot_train.py documents as its requirement -- so the
    # code that runs is the forked repo's, not a PyPI release.
    python -m pip install --constraint repro/constraints.txt -e ".[training]"
    # Gate the environment BEFORE any paid step: a `+cuNNN` local version or a
    # PEP-503 duplicate makes the recorded freeze un-installable from PyPI, so
    # the lineage could never be rebuilt. Fail here rather than at verification.
    python repro/freeze_audit.py
    python -c "import torch, torchvision; print('torch', torch.__version__, '| torchvision', torchvision.__version__, '| cuda', torch.cuda.is_available(), '|', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'cpu')"
    python -c "import lerobot; print('lerobot', lerobot.__version__ if hasattr(lerobot,'__version__') else 'n/a')"
    python -c "from lerobot.policies import make_policy; print('lerobot policies import OK')"
    which lerobot-train
    roar --version
    roar tracer use preload
    roar tracer
    roar init || true
  trace: off

fetch_dataset:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n fetch_dataset -- python repro/fetch_dataset.py --repo-id lerobot/pusht_image --out-dir data/pusht_image
  trace: off

train:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n train -- bash -c 'set -eo pipefail; lerobot-train --dataset.repo_id=lerobot/pusht_image --dataset.root=data/pusht_image --dataset.eval_split=0.1 --policy.type=act --policy.device=cuda --steps=300 --batch_size=8 --num_workers=2 --log_freq=25 --eval_steps=150 --env_eval_freq=0 --save_freq=-1 --seed=1000 --output_dir=outputs/act_pusht --job_name=act_pusht_truncated 2>&1 | tee logs/train.log'
  trace: off

evaluate:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n evaluate -- python repro/evaluate_act.py --checkpoint outputs/act_pusht/checkpoints/000300/pretrained_model --repo-id lerobot/pusht_image --root data/pusht_image --eval-split 0.1 --batch-size 8 --device cuda --out metrics/metrics.json
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact outputs/act_pusht/checkpoints/000300/pretrained_model/model.safetensors model.name=lerobot-act-pusht model.version=1 license.id=Apache-2.0 license.name='Apache License 2.0' description='LeRobot ACT (Action Chunking Transformer, ResNet-18 backbone) trained on the public lerobot/pusht_image LeRobotDataset. TRUNCATED pipeline-viability run: 300 of the 100000 default training steps, NOT converged.' documentation.url=https://github.com/huggingface/lerobot/blob/main/docs/source/act.mdx
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar put outputs/act_pusht/checkpoints/000300/pretrained_model/model.safetensors hf://reproducible-ai/lerobot-act --public --yes --no-tag -m "TRUNCATED pipeline-viability run of huggingface/lerobot's ACT policy on the public lerobot/pusht_image dataset: 300 of the 100000 default training steps, batch size 8, single L40S. NOT converged, not a quality result; published to demonstrate end-to-end provenance capture of a real framework's train pipeline."
  trace: off
