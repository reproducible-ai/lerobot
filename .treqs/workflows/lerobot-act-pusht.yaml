name: lerobot-act-pusht reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.

secrets:
  - HF_TOKEN            # roar put upload (the dataset itself is fetched anonymously)

# WHY THE TRACED STEPS ARE `python repro/<script>.py` AND NOT `lerobot-train`:
# every recorded step must be self-sufficient on a bare clone.
#  * `lerobot-train` is a console script created by `pip install`. The install
#    runs in this file's untraced setup stage, so it is not part of the recorded
#    pipeline and is not replayed on a rebuild host, where the script would not
#    exist. A recorded `lerobot==0.6.2` pin would not rescue it either -- that
#    version is not published on PyPI (latest release: 0.6.1).
#  * `PYTHONPATH=src python -m ...` would depend on an environment variable set
#    outside the recorded command, and needs a shell, which costs the tracer its
#    view of the Python process (a `bash -c` step recorded 10 pip packages --
#    roar's own -- instead of the workload's 70+).
# repro/train_act.py therefore does the `sys.path` insert itself, in committed
# code, and calls upstream's own `lerobot.scripts.lerobot_train.main()` with
# upstream's own arguments. repro/evaluate_act.py does the same. Nothing under
# src/ is modified. lerobot/__version__.py already degrades to "unknown" when the
# distribution is absent, so importing from source is a supported upstream path.

# EXPERIMENT LOGGING IS DELIBERATELY OFF, so `--wandb-to-trackio` is not passed on
# the run stages either. LeRobot does ship wandb support (--wandb.enable), but
# under the wandb->trackio alias it aborts in WandBLogger.__init__:
# src/lerobot/common/wandb_utils.py calls `wandb.run.get_url()`, which trackio's
# Run does not implement. Rather than patch upstream to accommodate the tracker,
# this row runs with logging off; the held-out metric is computed by the evaluate
# step and recorded as metrics/metrics.json instead.

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -c "import sys; print('python', sys.version)"
    python -m pip install --quiet requests || true
    # LeRobot is a framework, not a script. Install upstream's own declared
    # dependency set through its `training` extra (dataset + accelerate + wandb)
    # -- exactly what src/lerobot/scripts/lerobot_train.py documents as its
    # requirement.
    python -m pip install --constraint repro/constraints.txt -e ".[training]"
    # ...then drop the self-install, keeping every dependency. Two reasons, both
    # load-bearing:
    #  (1) roar's provenance filter classifies any path under an EDITABLE
    #      install's source dir as a "package read" and drops it. `pip install -e .`
    #      registers the WHOLE REPOSITORY as that source dir (direct_url.json,
    #      url=file://<repo>), so every read of data/ and outputs/ disappears and
    #      the lineage lands as disconnected nodes with no provenance edges.
    #  (2) this checkout declares version 0.6.2, which is not on PyPI (latest
    #      release 0.6.1), so a recorded `lerobot==0.6.2` pin could not resolve
    #      on a rebuild host anyway.
    # The traced steps import lerobot from the clone via repro/train_act.py and
    # repro/evaluate_act.py, which is what a rebuild host has.
    python -m pip uninstall -y lerobot
    python -m pip list 2>/dev/null | grep -Ei '^(torch|torchvision|torchcodec|numpy|datasets|pyarrow|accelerate|draccus|huggingface-hub|safetensors|einops|gymnasium|opencv-python-headless|wandb) ' || true
    # Gate the environment BEFORE any paid step: a `+cuNNN` local version or a
    # PEP-503 duplicate makes the recorded freeze un-installable from PyPI, so
    # the lineage could never be rebuilt. Fail here rather than at verification.
    python repro/freeze_audit.py
    python -c "import torch, torchvision; print('torch', torch.__version__, '| torchvision', torchvision.__version__, '| cuda', torch.cuda.is_available(), '|', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'cpu')"
    # lerobot must NOT be importable without the checkout on sys.path any more --
    # that is the proof there is no editable install left to blind the tracer.
    if python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('lerobot') is None else 1)"; then echo "OK: lerobot is not importable as an installed distribution"; else echo "ERROR: lerobot is still installed - reads under the repo would be filtered as package reads"; exit 1; fi
    # ...and WITH the checkout on sys.path it must resolve from src/, which is
    # exactly what the traced steps and a rebuild host both do.
    PYTHONPATH=src python -c "import importlib.util, os; s = importlib.util.find_spec('lerobot.scripts.lerobot_train'); print('train entry module:', s.origin); assert s.origin.startswith(os.path.join(os.getcwd(), 'src')), 'lerobot must resolve from the checkout'"
    PYTHONPATH=src python -c "import lerobot; from lerobot.policies import make_policy; print('lerobot', lerobot.__version__, 'imported from source OK')"
    roar --version
    roar tracer use preload
    roar tracer
    roar init || true
  trace: off

fetch_dataset:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n fetch_dataset -- python repro/fetch_dataset.py --repo-id lerobot/pusht_image --out-dir data/pusht_image
  trace: off

train:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n train -- python repro/train_act.py --dataset.repo_id=lerobot/pusht_image --dataset.root=data/pusht_image --dataset.eval_split=0.1 --policy.type=act --policy.device=cuda --policy.push_to_hub=false --steps=300 --batch_size=8 --num_workers=2 --log_freq=25 --eval_steps=150 --env_eval_freq=0 --save_freq=-1 --seed=1000 --output_dir=outputs/act_pusht --job_name=act_pusht_truncated
  trace: off

evaluate:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n evaluate -- python repro/evaluate_act.py --checkpoint outputs/act_pusht/checkpoints/000300/pretrained_model --repo-id lerobot/pusht_image --root data/pusht_image --eval-split 0.1 --batch-size 8 --device cuda --out metrics/metrics.json
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact outputs/act_pusht/checkpoints/000300/pretrained_model/model.safetensors model.name=lerobot-act-pusht model.version=1 license.id=Apache-2.0 license.name='Apache License 2.0' description='LeRobot ACT (Action Chunking Transformer, ResNet-18 backbone) trained on the public lerobot/pusht_image LeRobotDataset. TRUNCATED pipeline-viability run: 300 of the 100000 default training steps, NOT converged.' documentation.url=https://github.com/huggingface/lerobot/blob/main/docs/source/act.mdx
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar put outputs/act_pusht/checkpoints/000300/pretrained_model/model.safetensors hf://reproducible-ai/lerobot-act --public --yes --no-tag -m "TRUNCATED pipeline-viability run of huggingface/lerobot's ACT policy on the public lerobot/pusht_image dataset: 300 of the 100000 default training steps, batch size 8, single L40S. NOT converged, not a quality result; published to demonstrate end-to-end provenance capture of a real framework's train pipeline."
  trace: off
